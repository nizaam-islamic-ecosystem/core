[package]
name = "nizaam-core"
description = "Domain-agnostic Rust infrastructure core for building secure, observable, reliable, and extensible Nizaam engines."
version = "1.0.0"
edition = "2024"
rust-version = "1.96"

[workspace]
members = ["."]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "macros", "sync"] }
futures = "0.3"
sha2 = "0.11.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[lib]
# The package is named `core` at the user's direction. The Rust library target
# avoids colliding with Rust's built-in `core` crate in downstream imports.
name = "nizaam_core"
